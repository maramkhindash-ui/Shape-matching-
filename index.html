  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مطابقة الأشكال</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f7f7ff;
}

h2{
    margin-top:20px;
}

/* الحاويات */
.container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

/* أماكن الإسقاط */
.drop-zone{
    width:120px;
    height:120px;
    border:3px dashed #aaa;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
}

/* الأشكال */
.shape{
    cursor:grab;
}

/* دائرة */
.circle{
    width:90px;
    height:90px;
    background:red;
    border-radius:50%;
}

/* مربع */
.square{
    width:90px;
    height:90px;
    background:blue;
}

/* مستطيل */
.rectangle{
    width:130px;
    height:80px;
    background:green;
}

/* مثلث */
.triangle{
    width:0;
    height:0;
    border-left:45px solid transparent;
    border-right:45px solid transparent;
    border-bottom:90px solid orange;
}

/* نجمة */
.star{
    width:90px;
    height:90px;
    background:gold;
    clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 91%,
        50% 70%,
        21% 91%,
        32% 57%,
        2% 35%,
        39% 35%
    );
}

button{
    margin-top:30px;
    padding:10px 20px;
    font-size:18px;
}
</style>
</head>

<body>

<h2>🎯 مطابقة الأشكال</h2>

<div class="container" id="zones"></div>

<div class="container" id="shapes"></div>

<button onclick="resetGame()">إعادة اللعب</button>

<script>

const shapes = ["circle","square","rectangle","triangle","star"];

function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "ar-SA";
    speechSynthesis.speak(msg);
}

function shuffle(arr){
    return arr.sort(()=>Math.random()-0.5);
}

function createGame(){

    const zones = document.getElementById("zones");
    const shapesDiv = document.getElementById("shapes");

    zones.innerHTML = "";
    shapesDiv.innerHTML = "";

    let shuffled = shuffle([...shapes]);

    // إنشاء مناطق مطابقة (بدون كتابة)
    shapes.forEach(type=>{
        let zone = document.createElement("div");
        zone.className = "drop-zone";
        zone.dataset.name = type;

        // نفس الشكل داخل المكان كـ "ظل"
        let ghost = document.createElement("div");
        ghost.className = "shape " + type;
        ghost.style.opacity = "0.2";
        zone.appendChild(ghost);

        zone.ondragover = e => e.preventDefault();

        zone.ondrop = function(e){
            let shapeName = e.dataTransfer.getData("shape");

            if(shapeName === zone.dataset.name){
                zone.innerHTML = "";
                let correct = document.createElement("div");
                correct.className = "shape " + shapeName;
                zone.appendChild(correct);

                speak("ممتاز");
            }else{
                speak("حاول مرة أخرى");
            }
        };

        zones.appendChild(zone);
    });

    // إنشاء الأشكال السفلية
    shuffled.forEach(type=>{
        let el = document.createElement("div");
        el.className = "shape " + type;
        el.draggable = true;

        el.ondragstart = e=>{
            e.dataTransfer.setData("shape", type);
        };

        shapesDiv.appendChild(el);
    });
}

function resetGame(){
    createGame();
    speak("ابدأ من جديد");
}

createGame();

</script>

</body>
</html>
    
  </body>
  
</html>
